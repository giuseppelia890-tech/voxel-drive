<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(circle at 32% 16%, #17354e 0%, #0a1624 44%, #04070c 100%);
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(94, 231, 255, 0.075) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94, 231, 255, 0.075) 1px, transparent 1px);
    background-size: 32px 32px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 18%, transparent 74%);
    mask-image: radial-gradient(circle at 50% 45%, #000 18%, transparent 74%);
  }
  .glow {
    position: absolute; width: 360px; height: 360px; border-radius: 50%;
    left: 76px; top: 36px;
    background: radial-gradient(circle, rgba(94, 231, 255, 0.22), rgba(94, 231, 255, 0) 66%);
  }
  .road {
    position: absolute; left: 0; right: 0; bottom: 0; height: 146px;
    background: linear-gradient(180deg, #1c2836 0%, #111a26 55%, #0b111a 100%);
    border-top: 3px solid rgba(94, 231, 255, 0.22);
    box-shadow: inset 0 16px 40px rgba(0, 0, 0, 0.35);
  }
  .road::before {
    content: ''; position: absolute; left: 0; right: 0; top: 58px; height: 9px;
    background: repeating-linear-gradient(90deg, rgba(238, 246, 255, 0.6) 0 36px, transparent 36px 74px);
    opacity: 0.55;
  }
  .car { position: absolute; left: 86px; top: 166px; width: 340px; height: 190px; }
  .shadow {
    position: absolute; left: 18px; bottom: -8px; width: 304px; height: 26px;
    border-radius: 50%; background: rgba(0, 0, 0, 0.55); filter: blur(7px);
  }
  .speed {
    position: absolute; left: -38px; top: 82px; width: 96px; height: 70px;
    background: repeating-linear-gradient(180deg, rgba(94, 231, 255, 0.85) 0 8px, transparent 8px 22px);
    -webkit-mask-image: linear-gradient(90deg, #000, transparent);
    mask-image: linear-gradient(90deg, #000, transparent);
    opacity: 0.75;
  }
  .body {
    position: absolute; left: 20px; top: 86px; width: 304px; height: 76px;
    border-radius: 16px 26px 12px 12px;
    background: linear-gradient(180deg, #6cecff 0%, #43dfc4 52%, #25b78f 100%);
    box-shadow:
      inset 0 5px 0 rgba(255, 255, 255, 0.28),
      inset 0 -9px 0 rgba(4, 24, 30, 0.22),
      0 12px 26px rgba(0, 0, 0, 0.35);
  }
  .body::before {
    content: ''; position: absolute; left: 0; top: 16px; width: 100%; height: 8px;
    background: rgba(8, 26, 34, 0.26);
  }
  .nose {
    position: absolute; left: 286px; top: 100px; width: 52px; height: 48px;
    border-radius: 6px 20px 12px 6px;
    background: linear-gradient(180deg, #59e7ff, #27b895);
    box-shadow: inset 0 -6px 0 rgba(4, 24, 30, 0.2);
  }
  .cabin {
    position: absolute; left: 96px; top: 30px; width: 148px; height: 68px;
    border-radius: 20px 30px 4px 4px;
    background: linear-gradient(180deg, #1a3348, #0c1a29 72%);
    border: 4px solid rgba(94, 231, 255, 0.22);
    box-shadow: inset 0 8px 0 rgba(255, 255, 255, 0.05);
  }
  .cabin::before {
    content: ''; position: absolute; left: 16px; top: 12px; width: 110px; height: 8px;
    border-radius: 6px; background: rgba(94, 231, 255, 0.55);
    box-shadow: 0 18px 0 rgba(94, 231, 255, 0.28);
  }
  .spoiler {
    position: absolute; left: 4px; top: 58px; width: 88px; height: 14px;
    border-radius: 5px; background: #0c1724;
    box-shadow: 0 2px 0 rgba(94, 231, 255, 0.18);
  }
  .spoiler::after {
    content: ''; position: absolute; left: 18px; top: 12px; width: 9px; height: 24px;
    background: #0c1724;
  }
  .wheel {
    position: absolute; top: 140px; width: 62px; height: 62px; border-radius: 50%;
    background: #080c12;
    border: 7px solid #25313e;
    box-shadow: inset 0 0 0 7px #0e151d, 0 8px 14px rgba(0, 0, 0, 0.45);
  }
  .wheel::after {
    content: ''; position: absolute; inset: 17px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8b9aab, #3a4655 65%, #1a222c);
    border: 2px solid rgba(94, 231, 255, 0.35);
  }
  .wheel.front { left: 236px; }
  .wheel.rear { left: 58px; }
  .light {
    position: absolute; top: 102px; width: 20px; height: 12px; border-radius: 5px;
    background: #fff3c4; box-shadow: 0 0 18px 6px rgba(255, 224, 138, 0.55);
  }
  .light.f { left: 320px; }
  .light.r { left: 30px; background: #ff3b5c; box-shadow: 0 0 18px 6px rgba(255, 59, 92, 0.45); }
  .badge {
    position: absolute; left: 0; right: 0; top: 64px; text-align: center;
    font-size: 19px; font-weight: 900; letter-spacing: 8px; color: rgba(238, 246, 255, 0.9);
    text-shadow: 0 3px 18px rgba(0, 0, 0, 0.6);
  }
  .badge span { color: #5ee7ff; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="road"></div>
  <div class="badge">VOXEL <span>DRIVE</span></div>
  <div class="car">
    <div class="shadow"></div>
    <div class="speed"></div>
    <div class="body"></div>
    <div class="nose"></div>
    <div class="cabin"></div>
    <div class="spoiler"></div>
    <div class="wheel rear"></div>
    <div class="wheel front"></div>
    <div class="light r"></div>
    <div class="light f"></div>
  </div>
</body>
</html>
